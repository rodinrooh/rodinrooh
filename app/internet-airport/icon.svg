<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- runway -->
  <rect x="4" y="93" width="92" height="5" rx="2.5" fill="#c8c8c8"/>

  <!-- fuselage: tube from upper-left (tail) to lower-right (nose), ~38° descent -->
  <path d="M15 14 C12 17 12 22 16 26 L76 84 C80 88 85 88 88 85 C91 82 91 77 87 73 L27 15 C23 11 18 11 15 14 Z" fill="#d8dde2"/>
  <!-- fuselage top highlight -->
  <path d="M19 16 C17 18 17 22 20 25 L76 80 C79 83 82 83 84 81 L24 16 C22 14 20 14 19 16 Z" fill="white" opacity="0.65"/>

  <!-- right wing (upper-right) -->
  <path d="M55 45 L88 12 L62 52" fill="#b0b8be"/>
  <path d="M74 28 L88 12 L76 30" fill="#8e979d"/>

  <!-- left wing (lower-left) -->
  <path d="M43 55 L12 88 L36 48" fill="#b0b8be"/>
  <path d="M26 72 L12 88 L24 74" fill="#8e979d"/>

  <!-- tail vertical fin -->
  <path d="M17 18 L6 6 L22 22" fill="#9aa0a6"/>
  <!-- tail horizontal stab -->
  <path d="M19 21 L8 30 L22 25" fill="#9aa0a6"/>

  <!-- cockpit windows -->
  <ellipse cx="82" cy="79" rx="6" ry="6" fill="#5ba4cf" opacity="0.92"/>

  <!-- windows along fuselage -->
  <circle cx="68" cy="64" r="2.5" fill="#5ba4cf" opacity="0.85"/>
  <circle cx="60" cy="56" r="2.5" fill="#5ba4cf" opacity="0.85"/>
  <circle cx="52" cy="48" r="2.5" fill="#5ba4cf" opacity="0.85"/>
  <circle cx="44" cy="40" r="2.5" fill="#5ba4cf" opacity="0.85"/>

  <!-- landing gear front -->
  <line x1="76" y1="76" x2="74" y2="92" stroke="#5a6068" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="74" cy="94" r="4" fill="#3d4349"/>

  <!-- landing gear rear -->
  <line x1="64" y1="64" x2="62" y2="80" stroke="#5a6068" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="62" cy="82" r="4" fill="#3d4349"/>

  <!-- engine pod under right wing -->
  <ellipse cx="72" cy="32" rx="4" ry="7" fill="#9aa0a6" transform="rotate(45 72 32)"/>
</svg>
