<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- shadow -->
  <ellipse cx="50" cy="90" rx="38" ry="5" fill="#00000018"/>

  <!-- wheels (drawn first so body overlaps = wheel well effect) -->
  <circle cx="25" cy="76" r="15" fill="#1c1c1c"/>
  <circle cx="25" cy="76" r="9"  fill="#3a3a3a"/>
  <circle cx="25" cy="76" r="4"  fill="#666"/>
  <circle cx="75" cy="76" r="15" fill="#1c1c1c"/>
  <circle cx="75" cy="76" r="9"  fill="#3a3a3a"/>
  <circle cx="75" cy="76" r="4"  fill="#666"/>

  <!-- lower body -->
  <path d="M8 52 Q6 56 6 63 Q6 72 13 73 L87 73 Q94 72 94 63 Q94 56 90 52 Z" fill="#e8302a"/>
  <!-- body bottom sheen -->
  <path d="M8 64 Q6 68 6 63 Q6 72 13 73 L87 73 Q94 72 94 63 Q94 66 90 64 Z" fill="#00000015"/>

  <!-- cabin -->
  <path d="M23 52 L31 22 L69 22 L77 52 Z" fill="#c91c0e"/>

  <!-- window glass -->
  <path d="M30 50 L36 24 L66 24 L72 50 Z" fill="#1a2d50"/>
  <!-- center pillar -->
  <rect x="48" y="24" width="4" height="26" fill="#c91c0e"/>
  <!-- glare -->
  <path d="M58 28 L64 24 L70 24 L66 28 Z" fill="white" opacity="0.2"/>
  <path d="M36 28 L42 24 L48 24 L46 28 Z" fill="white" opacity="0.2"/>

  <!-- headlight -->
  <rect x="88" y="54" width="6" height="14" rx="3" fill="#fffde0"/>
  <!-- taillight -->
  <rect x="6"  y="54" width="6" height="14" rx="3" fill="#ff6060"/>

  <!-- side mirror -->
  <rect x="79" y="46" width="9" height="5" rx="2.5" fill="#c91c0e"/>
</svg>
