<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Wheels (drawn first so body overlaps = wheel well) -->
  <circle cx="24" cy="74" r="14" fill="#1a1a1a"/>
  <circle cx="24" cy="74" r="7" fill="#2d2d2d"/>
  <circle cx="24" cy="74" r="3" fill="#666"/>
  <circle cx="76" cy="74" r="14" fill="#1a1a1a"/>
  <circle cx="76" cy="74" r="7" fill="#2d2d2d"/>
  <circle cx="76" cy="74" r="3" fill="#666"/>

  <!-- Lower body -->
  <rect x="4" y="50" width="92" height="28" rx="8" fill="#e02020"/>

  <!-- Cabin -->
  <path d="M22 50 L30 22 L70 22 L78 50 Z" fill="#c01010"/>

  <!-- Window glass -->
  <path d="M34 48 L40 24 L62 24 L68 48 Z" fill="#1e3a6e" opacity="0.85"/>

  <!-- Center pillar -->
  <rect x="49.5" y="24" width="3" height="24" fill="#a00e0e"/>

  <!-- Headlight (right/front) -->
  <rect x="91" y="56" width="7" height="14" rx="3.5" fill="#fffde7"/>

  <!-- Taillight (left/back) -->
  <rect x="2" y="56" width="7" height="14" rx="3.5" fill="#ff8a80"/>

  <!-- Door line -->
  <line x1="50" y1="50" x2="50" y2="78" stroke="#c01010" stroke-width="1.5"/>

  <!-- Side mirror -->
  <rect x="79" y="44" width="7" height="5" rx="2" fill="#c01010"/>
</svg>
